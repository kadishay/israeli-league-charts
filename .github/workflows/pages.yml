# Publishes out/ to GitHub Pages.
#
# The charts are committed, so this deploys them as they stand rather than
# rebuilding: a rebuild would need the three fetch scripts to reach RSSSF and
# two Wikipedias from CI, and a rate-limited fetch failing would replace a good
# site with a worse one. The pipeline's output is reviewed in a commit; this
# just serves it.
name: Pages

on:
  push:
    branches: [main]
    paths: ["out/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it half-published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out
      - id: deployment
        uses: actions/deploy-pages@v4
